<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | College StudyHub</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<nav class="login-nav">
    <a href="index.html" class="brand">🎓 <span>StudyHub</span></a>
    <a href="index.html" class="home-btn">🏠 Home</a>
</nav>

<main class="auth-wrapper">

<div class="auth-card">

    <div class="auth-icon">🚀</div>

    <div class="welcome-text">
        <span>✨ Join StudyHub</span>
        <h1>Create Account</h1>
        <p>Create your student account and start learning smarter.</p>
    </div>

    <form action="/CollegeStudyHub/register-process.jsp" method="POST">

        <div class="form-group">
            <label>👤 Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>📧 Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>🎓 Course</label>
            <select name="course" required>
                <option value="">Select your course</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="B.Com">B.Com</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>📚 Current Semester</label>
            <select name="semester" required>
                <option value="">Select semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
            </select>
        </div>

        <div class="form-group">
            <label>🔐 Password</label>
            <input type="password" name="password"
                   placeholder="Minimum 6 characters"
                   minlength="6" required>
        </div>

        <div class="form-group">
            <label>🔒 Confirm Password</label>
            <input type="password" name="confirmPassword"
                   placeholder="Enter password again"
                   minlength="6" required>
        </div>

        <label class="terms">
            <input type="checkbox" required>
            <span>I agree to use StudyHub for educational purposes.</span>
        </label>

        <button type="submit" class="main-btn">
            🚀 Create My Account
        </button>

    </form>

    <div class="divider"><span>OR</span></div>

    <div class="create-account">
        <p>Already have an account?</p>
        <a href="login.html" class="register-btn">
            🔐 Login to StudyHub
        </a>
    </div>

    <a href="admin-login.html" class="admin-link">
        🛠️ Admin Login
    </a>

</div>

</main>

</body>
</html>
