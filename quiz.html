<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================
   STUDYHUB QUIZ DARK THEME
   ========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "DM Sans", Arial, sans-serif;
    min-height: 100vh;
    color: #f8fafc;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(124, 58, 237, 0.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(236, 72, 153, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(56, 189, 248, 0.10),
            transparent 35%
        ),
        #080b18;

    background-attachment: fixed;
}


/* =========================
   NAVBAR
   ========================= */

.navbar {
    width: 100%;
    padding: 18px 7%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: rgba(8, 11, 24, 0.82);

    border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(18px);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);

    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            #a855f7,
            #ec4899,
            #38bdf8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    text-decoration: none;
    color: #cbd5e1;
    font-weight: 600;

    transition: 0.3s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: #c084fc;
}


/* =========================
   HERO
   ========================= */

.hero {
    text-align: center;
    padding: 55px 20px 30px;
}

.hero h1 {
    font-size: 42px;
    margin: 0 0 10px;

    background:
        linear-gradient(
            90deg,
            #a855f7,
            #ec4899,
            #38bdf8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: #94a3b8;
    font-size: 17px;
}


/* =========================
   MAIN QUIZ BOX
   ========================= */

.quiz-container {
    width: 90%;
    max-width: 900px;

    margin: 25px auto 60px;

    background:
        rgba(255, 255, 255, 0.055);

    border:
        1px solid rgba(255, 255, 255, 0.10);

    border-radius: 28px;

    padding: 35px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);

    backdrop-filter: blur(18px);
}


/* =========================
   SELECT AREA
   ========================= */

.select-area {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-bottom: 25px;
}

.field label {
    display: block;

    font-weight: 700;

    color: #e2e8f0;

    margin-bottom: 8px;
}

select {
    width: 100%;

    padding: 14px;

    border:
        1px solid rgba(255, 255, 255, 0.12);

    border-radius: 14px;

    font-size: 15px;

    background: #111827;

    color: #f8fafc;

    outline: none;
}

select:focus {
    border-color: #a855f7;

    box-shadow:
        0 0 0 3px rgba(168, 85, 247, 0.12);
}

select option {
    background: #111827;
    color: white;
}


/* =========================
   BUTTON
   ========================= */

.btn {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #ec4899
        );

    color: white;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.25s ease;

    box-shadow:
        0 10px 25px rgba(139, 92, 246, 0.20);
}

.btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 30px rgba(236, 72, 153, 0.25);
}


/* =========================
   QUIZ
   ========================= */

#quizBox {
    display: none;
}

.progress-text {
    font-weight: 700;
    color: #cbd5e1;

    margin-bottom: 8px;
}

.progress {
    width: 100%;

    height: 10px;

    background:
        rgba(255, 255, 255, 0.08);

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #ec4899,
            #38bdf8
        );

    transition: 0.3s;
}

.question {
    font-size: 22px;

    font-weight: 700;

    line-height: 1.5;

    color: #f8fafc;

    margin-bottom: 22px;
}


/* =========================
   OPTIONS
   ========================= */

.option {
    width: 100%;

    text-align: left;

    padding: 16px;

    margin: 10px 0;

    border:
        1px solid rgba(255, 255, 255, 0.10);

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.045);

    color: #e2e8f0;

    cursor: pointer;

    font-size: 16px;

    transition: 0.2s ease;
}

.option:hover {
    border-color: #a855f7;

    background:
        rgba(168, 85, 247, 0.10);

    transform: translateY(-1px);
}

.option.selected {
    border-color: #a855f7;

    background:
        linear-gradient(
            90deg,
            rgba(139, 92, 246, 0.20),
            rgba(236, 72, 153, 0.12)
        );

    color: white;

    box-shadow:
        0 0 20px rgba(139, 92, 246, 0.12);
}

.next-btn {
    margin-top: 20px;
}


/* =========================
   RESULT
   ========================= */

#resultBox {
    display: none;

    text-align: center;
}

#resultBox h2 {
    color: #f8fafc;

    margin-bottom: 15px;
}

.result-circle {
    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899,
            #38bdf8
        );

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    margin: 20px auto;

    box-shadow:
        0 10px 35px rgba(139, 92, 246, 0.25);
}

.result-circle strong {
    font-size: 35px;
}

.result-info {
    display: flex;

    justify-content: center;

    gap: 25px;

    flex-wrap: wrap;

    margin: 25px 0;
}

.result-card {
    min-width: 130px;

    background:
        rgba(255, 255, 255, 0.06);

    border:
        1px solid rgba(255, 255, 255, 0.10);

    padding: 18px 30px;

    border-radius: 15px;

    color: #cbd5e1;
}

.result-card strong {
    display: block;

    font-size: 25px;

    color: #c084fc;

    margin-bottom: 5px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:700px) {

    .nav-links {
        display: none;
    }

    .hero h1 {
        font-size: 32px;
    }

    .quiz-container {
        padding: 22px;
    }

    .select-area {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">🎓 StudyHub</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="handwritten-notes.html">Handwritten Notes</a>
        <a href="pyqs.html">PYQs</a>
        <a href="quiz.html">Quiz</a>
    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <h1>🧠 StudyHub Quiz</h1>

    <p>
        Choose your subject and unit and test your knowledge!
    </p>

</section>


<!-- MAIN -->

<div class="quiz-container">

    <!-- SELECT -->

    <div id="setupBox">

        <div class="select-area">

            <div class="field">

                <label>📚 Select Subject</label>

                <select id="subjectSelect">

                    <option value="">
                        -- Select Subject --
                    </option>

                </select>

            </div>


            <div class="field">

                <label>📖 Select Unit</label>

                <select id="unitSelect">

                    <option value="">
                        -- Select Unit --
                    </option>

                </select>

            </div>

        </div>


        <button class="btn" onclick="startQuiz()">
            🚀 Start Quiz
        </button>

    </div>


    <!-- QUIZ -->

    <div id="quizBox">

        <div class="progress-text" id="progressText">
            Question 1 of 5
        </div>

        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <div
            class="question"
            id="questionText">
        </div>


        <div id="optionsBox"></div>


        <button
            class="btn next-btn"
            id="nextButton"
            onclick="nextQuestion()">

            Next ➜

        </button>

    </div>


    <!-- RESULT -->

    <div id="resultBox">

        <h2>🎉 Quiz Completed!</h2>

        <div class="result-circle">

            <strong id="scoreText">0/5</strong>

            <span>Score</span>

        </div>


        <div class="result-info">

            <div class="result-card">

                <strong id="correctText">0</strong>

                Correct

            </div>


            <div class="result-card">

                <strong id="wrongText">0</strong>

                Wrong

            </div>


            <div class="result-card">

                <strong id="pointsText">0</strong>

                Points

            </div>

        </div>


        <button
            class="btn"
            onclick="restartQuiz()">

            🔄 Try Again

        </button>

    </div>

</div>


<!-- IMPORTANT -->
<!-- quiz-data.js MUST COME FIRST -->

<script src="js/quiz-data.js"></script>


<script>

/* ==========================================
   SUBJECT LIST
========================================== */

const subjects = [

    "Soft Skills",
    "Fundamental of Computers",
    "Mathematics",
    "C Programming",
    "Basics Of Information System",
    "Data Structure",
    "DBMS",
    "Operating System",
    "Discrete Mathematics",
    "Digital Electronics",
    "OOPs using Java",
    "Software Engineering",
    "Computer Architecture",
    "Python Programming",
    "Accounting & Financial Management",
    "Advanced Java",
    "DAA",
    "Web Design Concepts",
    "Computer Graphics",
    "Managerial Economics",
    "Computer Networks",
    "Artificial Intelligence",
    "Cyber Law",
    "Data Analytics",
    "Software Testing"

];


/* ==========================================
   GET ELEMENTS
========================================== */

const subjectSelect =
    document.getElementById("subjectSelect");

const unitSelect =
    document.getElementById("unitSelect");


/* ==========================================
   ADD ALL SUBJECTS
========================================== */

subjects.forEach(function(subject){

    const option =
        document.createElement("option");

    option.value = subject;

    option.textContent = subject;

    subjectSelect.appendChild(option);

});


/* ==========================================
   SUBJECT CHANGE
========================================== */

subjectSelect.addEventListener(
    "change",
    function(){

        // Clear old units

        unitSelect.innerHTML = `
            <option value="">
                -- Select Unit --
            </option>
        `;


        // If subject not selected

        if(this.value === ""){
            return;
        }


        /*
          Every subject has Unit 1 to Unit 5
        */

        for(let i = 1; i <= 5; i++){

            const option =
                document.createElement("option");

            option.value =
                "Unit " + i;

            option.textContent =
                "Unit " + i;

            unitSelect.appendChild(option);

        }

    }
);


/* ==========================================
   QUIZ VARIABLES
========================================== */

let currentQuestions = [];

let currentQuestion = 0;

let score = 0;

let points = 0;

let selectedAnswer = null;


/* ==========================================
   START QUIZ
========================================== */

function startQuiz(){

    const subject =
        subjectSelect.value;

    const unit =
        unitSelect.value;


    if(subject === ""){

        alert("Please select a subject.");

        return;

    }


    if(unit === ""){

        alert("Please select a unit.");

        return;

    }


    /*
      Find selected subject + unit
      from quizData
    */

    const unitData =
        window.quizData.find(function(item){

            return (
                item.subject === subject &&
                item.unit === unit
            );

        });


    if(!unitData){

        alert(
            "Questions for this subject/unit are not available yet."
        );

        return;

    }


    currentQuestions =
        unitData.questions;


    if(
        !currentQuestions ||
        currentQuestions.length === 0
    ){

        alert("No questions found for this unit.");

        return;

    }


    currentQuestion = 0;

    score = 0;

    points = 0;


    document.getElementById("setupBox")
        .style.display = "none";


    document.getElementById("quizBox")
        .style.display = "block";


    showQuestion();

}


/* ==========================================
   SHOW QUESTION
========================================== */

function showQuestion(){

    const q =
        currentQuestions[currentQuestion];


    selectedAnswer = null;


    document.getElementById("progressText")
        .textContent =
        `Question ${currentQuestion + 1} of ${currentQuestions.length}`;


    document.getElementById("progressBar")
        .style.width =
        `${((currentQuestion + 1) / currentQuestions.length) * 100}%`;


    document.getElementById("questionText")
        .textContent =
        q.question;


    const optionsBox =
        document.getElementById("optionsBox");


    optionsBox.innerHTML = "";


    q.options.forEach(function(option,index){

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            String.fromCharCode(65 + index)
            + ". "
            + option;


        button.onclick =
            function(){

                selectAnswer(index,button);

            };


        optionsBox.appendChild(button);

    });


    const nextButton =
        document.getElementById("nextButton");


    if(
        currentQuestion ===
        currentQuestions.length - 1
    ){

        nextButton.textContent =
            "Finish Quiz 🎉";

    }else{

        nextButton.textContent =
            "Next ➜";

    }

}


/* ==========================================
   SELECT ANSWER
========================================== */

function selectAnswer(index,button){

    selectedAnswer = index;


    document
        .querySelectorAll(".option")
        .forEach(function(btn){

            btn.classList.remove("selected");

        });


    button.classList.add("selected");

}


/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion(){

    if(selectedAnswer === null){

        alert("Please select an answer.");

        return;

    }


    const q =
        currentQuestions[currentQuestion];


    if(selectedAnswer === q.answer){

        score++;

        points += q.points || 10;

    }


    currentQuestion++;


    if(
        currentQuestion <
        currentQuestions.length
    ){

        showQuestion();

    }else{

        showResult();

    }

}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult(){

    document.getElementById("quizBox")
        .style.display = "none";


    document.getElementById("resultBox")
        .style.display = "block";


    document.getElementById("scoreText")
        .textContent =
        `${score}/${currentQuestions.length}`;


    document.getElementById("correctText")
        .textContent =
        score;


    document.getElementById("wrongText")
        .textContent =
        currentQuestions.length - score;


    document.getElementById("pointsText")
        .textContent =
        points;

}


/* ==========================================
   RESTART
========================================== */

function restartQuiz(){

    document.getElementById("resultBox")
        .style.display = "none";


    document.getElementById("setupBox")
        .style.display = "block";


    subjectSelect.value = "";


    unitSelect.innerHTML = `
        <option value="">
            -- Select Unit --
        </option>
    `;

}

</script>

</body>
</html>
