<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Bookmarks | College StudyHub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    min-height:100vh;

    color:white;

    background:
    radial-gradient(
        circle at top left,
        #312e81,
        transparent 35%
    ),
    radial-gradient(
        circle at bottom right,
        #831843,
        transparent 35%
    ),
    #080b18;

    padding:30px;
}


/* NAVBAR */

.navbar{

    max-width:1200px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:40px;

}

.logo{

    color:#c084fc;

    font-size:25px;

    font-weight:bold;

    text-decoration:none;

}

.home-btn{

    color:white;

    text-decoration:none;

    padding:10px 18px;

    border-radius:10px;

    background:
    rgba(255,255,255,0.08);

    border:
    1px solid
    rgba(255,255,255,0.12);

}


/* MAIN */

.container{

    max-width:1200px;

    margin:auto;

}


/* HEADER */

.header{

    margin-bottom:30px;

}

.header h1{

    font-size:36px;

    margin-bottom:10px;

    background:
    linear-gradient(
        90deg,
        #c084fc,
        #f472b6
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}

.header p{

    color:#94a3b8;

    line-height:1.6;

}


/* SEARCH */

.search-box{

    margin-bottom:30px;

}

.search-box input{

    width:100%;

    max-width:550px;

    padding:15px 18px;

    border-radius:12px;

    border:
    1px solid
    rgba(255,255,255,0.12);

    background:
    rgba(255,255,255,0.06);

    color:white;

    outline:none;

    font-size:15px;

}

.search-box input:focus{

    border-color:#a855f7;

}

.search-box input::placeholder{

    color:#64748b;

}


/* BOOKMARK GRID */

#bookmarksContainer{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:22px;

}


/* BOOKMARK CARD */

.bookmark-card{

    position:relative;

    padding:24px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid
    rgba(255,255,255,0.1);

    backdrop-filter:blur(15px);

    transition:0.3s;

    min-height:200px;

}

.bookmark-card:hover{

    transform:translateY(-5px);

    border-color:#a855f7;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,0.25);

}

.bookmark-type{

    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    font-size:11px;

    color:#ddd6fe;

    background:
    rgba(139,92,246,0.18);

    margin-bottom:14px;

}

.bookmark-card h3{

    font-size:20px;

    margin-bottom:10px;

    color:white;

    word-break:break-word;

}

.bookmark-card p{

    color:#94a3b8;

    margin-bottom:20px;

}

.bookmark-card a{

    color:#c084fc;

    text-decoration:none;

    font-weight:bold;

}

.bookmark-card a:hover{

    color:#f472b6;

}


/* DELETE */

.delete-bookmark{

    position:absolute;

    right:18px;

    bottom:18px;

    padding:7px 12px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    color:#fecaca;

    background:
    rgba(239,68,68,0.12);

}

.delete-bookmark:hover{

    background:
    rgba(239,68,68,0.25);

}


/* EMPTY */

.empty-state{

    grid-column:1/-1;

    text-align:center;

    padding:60px 20px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid
    rgba(255,255,255,0.08);

}

.empty-state h3{

    color:#c084fc;

    font-size:22px;

    margin-bottom:10px;

}

.empty-state p{

    color:#64748b;

}


/* MOBILE */

@media(max-width:900px){

    #bookmarksContainer{

        grid-template-columns:
        repeat(2,1fr);

    }

}

@media(max-width:600px){

    body{

        padding:20px;

    }

    .navbar{

        align-items:flex-start;

    }

    #bookmarksContainer{

        grid-template-columns:1fr;

    }

    .header h1{

        font-size:30px;

    }

}

</style>

</head>


<body>


<nav class="navbar">

    <a href="index.html"
       class="logo">

        🎓 StudyHub

    </a>

    <a href="dashboard.html"
       class="home-btn">

        ← Dashboard

    </a>

</nav>


<main class="container">


<section class="header">

    <h1>
        🔖 My Bookmarks
    </h1>

    <p>
        Save important notes, PYQs and study resources
        for quick access later.
    </p>

</section>


<div class="search-box">

    <input
        type="text"
        id="searchBookmarks"
        placeholder="🔍 Search your bookmarks..."
    >

</div>


<section>

    <div id="bookmarksContainer">

        <div class="empty-state">

            <h3>
                Loading bookmarks...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    </div>

</section>


</main>


<script src="bookmarks.js"></script>


</body>

</html>
